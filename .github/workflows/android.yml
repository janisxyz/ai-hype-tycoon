name: Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Bump, build, release
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          FILE=android/version.properties
          CODE=$(grep -E '^versionCode=' "$FILE" | cut -d= -f2 | tr -d '[:space:]')
          NAME=$(grep -E '^versionName=' "$FILE" | cut -d= -f2 | tr -d '[:space:]')
          MAJ=$(printf '%s' "$NAME" | cut -d. -f1)
          MIN=$(printf '%s' "$NAME" | cut -d. -f2)
          PAT=$(printf '%s' "$NAME" | cut -d. -f3)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "code=${CODE}" >> "$GITHUB_OUTPUT"
            echo "name=${NAME}" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "PR build using ${NAME} (${CODE})"
            exit 0
          fi
          NEW_CODE=$((CODE + 1))
          NEW_PAT=$((PAT + 1))
          NEW_NAME="${MAJ}.${MIN}.${NEW_PAT}"
          if [ "$NEW_CODE" -lt "${{ github.run_number }}" ]; then
            NEW_CODE=${{ github.run_number }}
          fi
          printf 'versionCode=%s\nversionName=%s\n' "$NEW_CODE" "$NEW_NAME" > "$FILE"
          echo "code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "Bumped ${CODE}/${NAME} -> ${NEW_CODE}/${NEW_NAME}"

      - name: Commit version bump
        if: steps.ver.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/version.properties
          git commit -m "chore(release): v${{ steps.ver.outputs.name }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Build 3D game into Android assets
        run: npm run build:apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode upload keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          else
            echo "No upload keystore secret; release APK/AAB will use the debug key."
          fi

      - name: Assemble release APK and AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ steps.ver.outputs.name }}"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          cp "$APK" "dist/AI-Hype-Tycoon-${VER}.apk"
          cp "$AAB" "dist/AI-Hype-Tycoon-${VER}.aab"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Hype-Tycoon-${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: AI Hype Tycoon ${{ steps.ver.outputs.name }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            **${{ steps.ver.outputs.name }}** (versionCode ${{ steps.ver.outputs.code }})

            Sideload the **release APK**. This build is the 3D campus — tap Lab, train, open Chat.

            Upload the **AAB** to Play Console if it is signed with your upload key.
