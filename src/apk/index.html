<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#07080a" />
    <title>AI Hype Tycoon</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #07080a;
        color: #f3e6c8;
        overscroll-behavior: none;
      }
      #root > div {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      .game-shell {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      .game-map {
        position: absolute;
        inset: 0;
      }
      .game-map canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      .game-hud-col {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
        padding: 28px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      }
      .game-panel {
        pointer-events: auto;
        border-radius: 22px;
        background: rgba(7, 8, 10, 0.86);
        border: 1px solid rgba(243, 230, 200, 0.16);
        padding: 18px;
      }
      .game-cta {
        pointer-events: auto;
        display: block;
        width: 100%;
        min-height: 54px;
        margin-top: 12px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(180deg, #f7ebc8, #e4c56a);
        color: #07080a;
        font: 650 16px/1.2 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
      .game-field {
        pointer-events: auto;
        display: block;
        width: 100%;
        min-height: 48px;
        margin-top: 8px;
        box-sizing: border-box;
        border: 1px solid rgba(243, 230, 200, 0.26);
        border-radius: 12px;
        background: #10141a;
        color: #f4efe4;
        padding: 0 12px;
        font: 16px/1.2 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
